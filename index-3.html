<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Simple Present Adventure</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #87ceeb, #fff59d, #b2ebf2);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        text-align: center;
        padding: 20px;
      }

      #owl {
        font-size: 80px;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      h1 {
        color: #0d47a1;
      }

      .subtitle {
        color: #333;
        margin-top: 10px;
      }

      #container {
        width: 92%;
        max-width: 850px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 25px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      #score {
        font-size: 24px;
        color: #2e7d32;
        margin-bottom: 15px;
      }

      #progressBox {
        width: 100%;
        height: 25px;
        background: #ddd;
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 25px;
      }

      #progress {
        width: 0%;
        height: 100%;
        background: #4caf50;
        transition: 0.5s;
      }

      #question {
        font-size: 32px;
        color: #333;
        margin-bottom: 20px;
      }

      .listenBtn {
        background: #ff9800;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 15px;
        cursor: pointer;
        font-size: 17px;
        margin-bottom: 20px;
      }

      .option {
        margin: 12px;
      }

      .answerBtn {
        background: #42a5f5;
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 15px;
        cursor: pointer;
        font-size: 20px;
        min-width: 150px;
      }

      .answerBtn:hover {
        background: #1e88e5;
      }

      .audioBtn {
        background: #ff9800;
        color: white;
        border: none;
        padding: 15px 18px;
        border-radius: 15px;
        cursor: pointer;
        margin-left: 8px;
      }

      #feedback {
        margin-top: 25px;
        min-height: 50px;
        font-size: 28px;
        font-weight: bold;
      }

      #certificate {
        display: none;
      }

      #certificate h2 {
        color: #2e7d32;
      }

      #certificate p {
        margin-top: 15px;
        font-size: 20px;
      }

      footer {
        background: #0d47a1;
        color: white;
        text-align: center;
        padding: 30px;
        margin-top: 40px;
      }

      .socials {
        margin-top: 20px;
      }

      .socials a {
        text-decoration: none;
        margin: 0 12px;
        font-size: 42px;
        transition: 0.3s;
      }

      .socials a:hover {
        transform: scale(1.25);
      }

      .fa-whatsapp {
        color: #25d366;
      }

      .fa-instagram {
        color: #e4405f;
      }

      .fa-facebook {
        color: #1877f2;
      }

      .fa-youtube {
        color: #ff0000;
      }

      .fa-chrome {
        color: #34a853;
      }

      @media (max-width: 600px) {
        #question {
          font-size: 24px;
        }

        .answerBtn {
          width: 80%;
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div id="owl">🦉</div>

      <h1>Ejercicio para niños y niñas</h1>

      <p class="subtitle">Aprende inglés con el búho Óliver</p>
    </header>

    <div id="container">
      <div id="score">⭐ Estrellas: <span id="stars">0</span></div>

      <div id="progressBox">
        <div id="progress"></div>
      </div>

      <div id="question"></div>

      <button class="listenBtn" onclick="speakQuestion()">
        🔊 Leer en voz alta
      </button>

      <div id="answers"></div>

      <div id="feedback"></div>

      <div id="certificate">
        <h2>🏆 Certificate of Achievement</h2>

        <p>Congratulations!</p>

        <p>You completed the Simple Present Adventure.</p>

        <p id="finalStars"></p>
      </div>
    </div>

    <footer>
      <h2></h2>

      <p>
        Ejercicio en línea creado y diseñado en Santiago de Puriscal, San José,
        Costa Rica.
      </p>

      <div class="socials">
        <a href="https://walink.co/341b8e" target="_blank">
          <i class="fab fa-whatsapp"></i>
        </a>

        <a href="https://www.instagram.com/josbrevar07/" target="_blank">
          <i class="fab fa-instagram"></i>
        </a>

        <a href="https://www.facebook.com/josue.brenesvargas" target="_blank">
          <i class="fab fa-facebook"></i>
        </a>

        <a href="https://www.youtube.com/@josbrevar0773" target="_blank">
          <i class="fab fa-youtube"></i>
        </a>

        <a href="https://clases-de-manejo-personalizadas.com/" target="_blank">
          <i class="fab fa-chrome"></i>
        </a>
      </div>

      <p style="margin-top: 20px">Designed by Josbrevar07, 2026</p>
    </footer>

    <script>
      const questions = [
        {
          question: "🍕 I _____ pizza.",
          speakText: "I like pizza",
          options: ["like", "likes", "liking"],
          correct: "like",
        },

        {
          question: "⚽ You _____ soccer.",
          speakText: "You play soccer",
          options: ["play", "plays", "playing"],
          correct: "play",
        },

        {
          question: "📚 I _____ English.",
          speakText: "I study English",
          options: ["study", "studies", "studying"],
          correct: "study",
        },

        {
          question: "🚗 You _____ to school.",
          speakText: "You go to school",
          options: ["go", "goes", "going"],
          correct: "go",
        },

        {
          question: "🐶 I _____ a dog.",
          speakText: "I have a dog",
          options: ["have", "has", "having"],
          correct: "have",
        },

        {
          question: "🍎 I _____ an apple every day.",
          speakText: "I eat an apple every day",
          options: ["eat", "eats", "eating"],
          correct: "eat",
        },

        {
          question: "📺 You _____ TV.",
          speakText: "You watch TV",
          options: ["watch", "watches", "watching"],
          correct: "watch",
        },
      ];

      let current = 0;
      let stars = 0;

      function speak(text) {
        speechSynthesis.cancel();

        const msg = new SpeechSynthesisUtterance(text);

        msg.lang = "en-US";
        msg.rate = 0.9;
        msg.pitch = 1;

        speechSynthesis.speak(msg);
      }

      function speakQuestion() {
        speak(questions[current].speakText);
      }

      function correctSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();

        osc.frequency.value = 800;
        osc.type = "sine";

        osc.connect(ctx.destination);

        osc.start();

        osc.stop(ctx.currentTime + 0.2);
      }

      function wrongSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();

        osc.frequency.value = 180;
        osc.type = "square";

        osc.connect(ctx.destination);

        osc.start();

        osc.stop(ctx.currentTime + 0.3);
      }

      function loadQuestion() {
        if (current >= questions.length) {
          document.getElementById("question").style.display = "none";

          document.querySelector(".listenBtn").style.display = "none";

          document.getElementById("answers").style.display = "none";

          document.getElementById("feedback").style.display = "none";

          document.getElementById("certificate").style.display = "block";

          document.getElementById("finalStars").innerHTML =
            "⭐ Total Stars: " + stars;

          speak("Congratulations. You completed the game.");

          return;
        }

        const q = questions[current];

        document.getElementById("question").innerHTML = q.question;

        const percentage = (current / questions.length) * 100;

        document.getElementById("progress").style.width = percentage + "%";

        let html = "";

        q.options.forEach((option) => {
          html += `
        <div class="option">

        <button
        class="answerBtn"
        onclick="checkAnswer('${option}')">
        ${option}
        </button>

        <button
        class="audioBtn"
        onclick="speak('${option}')">
        🔊
        </button>

        </div>
        `;
        });

        document.getElementById("answers").innerHTML = html;

        setTimeout(() => {
          speakQuestion();
        }, 500);
      }

      function checkAnswer(answer) {
        const q = questions[current];

        if (answer === q.correct) {
          stars++;

          correctSound();

          document.getElementById("stars").textContent = stars;

          document.getElementById("feedback").innerHTML = "✅ Great Job!";

          speak("Excellent!");
        } else {
          wrongSound();

          document.getElementById("feedback").innerHTML = "❌ Try Again";

          speak("Try again");
        }

        setTimeout(() => {
          current++;

          document.getElementById("feedback").innerHTML = "";

          loadQuestion();
        }, 1500);
      }

      loadQuestion();
    </script>
  </body>
</html>
